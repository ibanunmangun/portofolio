name: Validate portfolio site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse and validate landing page
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path("index.html")
          if not page.is_file():
              raise SystemExit("Missing required file: index.html")

          source = page.read_text(encoding="utf-8")
          required_fragments = (
              "<!doctype html>",
              "<html",
              "<head>",
              "<body",
              "<title>",
              "<meta name=\"viewport\"",
              "<main",
              "</html>",
          )
          missing = [item for item in required_fragments if item not in source.lower()]
          if missing:
              raise SystemExit(f"Missing required HTML fragments: {', '.join(missing)}")

          class Validator(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          Validator().feed(source)
          Validator().close()
          print("index.html parsed and required document structure is present")
          PY

  validate-case-study-assets:
    name: Validate case-study assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Karhutla page, provenance, and display assets
        run: python3 scripts/validate_kalteng_case_study.py

      - name: Validate Aceh Tamiang report-footprint assets
        run: python3 scripts/validate_aceh_tamiang_flood_context.py

      - name: Check case-study JavaScript syntax
        run: |
          node --check karhutla-review/app.js
          node --check aceh-tamiang-flood-review/app.js

      - name: Scan published assets for credential assignments
        run: |
          if grep -RInE --include='*.html' --include='*.js' --include='*.json' --include='*.geojson' 'FIRMS_MAP_KEY|api[_-]?key[[:space:]]*[:=]|secret[[:space:]]*[:=]|password[[:space:]]*[:=]|token[[:space:]]*[:=]' index.html karhutla-review aceh-tamiang-flood-review data; then
            echo "Potential published credential assignment found" >&2
            exit 1
          fi
          echo "No published credential assignments found"
